services:

  db: 
    image: postgres:17
    restart: unless-stopped
    shm_size: 64mb

    ports:
      - "5432:5432" # Padrão PostgreSQL
    
    volumes:
      - pgdata:/var/lib/postgresql/data #também padrão do PostgreeSQL
    


    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  pgdata:
    